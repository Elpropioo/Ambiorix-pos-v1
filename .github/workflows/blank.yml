name: Build Ambiorix POS APK

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find app/build/outputs/apk -type f -name '*.apk' -print
          cp app/build/outputs/apk/debug/app-debug.apk dist/AmbiorixPOS-debug.apk
          if [[ -f app/build/outputs/apk/release/app-release.apk ]]; then
            cp app/build/outputs/apk/release/app-release.apk dist/AmbiorixPOS-release.apk
          fi
          ls -lh dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AmbiorixPOS-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
